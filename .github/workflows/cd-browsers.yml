# Hand-maintained: not generated by ADL CLI (spec.scm only toggles ci.yml/cd.yml).
# One image per engine. cd.yml publishes :<version> and :latest (lightpanda).

---
name: CD Browsers

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        engine:
          - lightpanda
          - chromium
          - firefox
          - webkit

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${INPUT_VERSION:-$RELEASE_TAG}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "Error: could not determine the version to build"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
        with:
          version: latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          ENGINE: ${{ matrix.engine }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          REPO_LOWER=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          DESCRIPTION="AI agent for browser automation and web testing using Playwright ($ENGINE)"

          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "BROWSER_ENGINE=$ENGINE" \
            --cache-from "type=gha,scope=$ENGINE" \
            --cache-to "type=gha,mode=max,scope=$ENGINE" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$REPO_LOWER" \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.title=browser-agent-$ENGINE" \
            --tag "ghcr.io/$REPO_LOWER:$ENGINE-$VERSION" \
            --tag "ghcr.io/$REPO_LOWER:$ENGINE" \
            --push .
